<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 0.95em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .stat-box h3 {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-box p {
            font-size: 0.85em;
            opacity: 0.9;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .input-section input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-section input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-section button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .input-section button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .input-section button:active {
            transform: translateY(0);
        }

        .filter-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            transition: all 0.3s;
            color: #666;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .todo-list {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .todo-list::-webkit-scrollbar {
            width: 6px;
        }

        .todo-list::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .todo-list::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .todo-list::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s;
            border-left: 4px solid #667eea;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .todo-item.completed {
            opacity: 0.6;
            background: #e8f5e9;
            border-left-color: #4caf50;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        .todo-item.high-priority {
            border-left-color: #ff6b6b;
            background: #ffe0e0;
        }

        .todo-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .todo-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .todo-text {
            font-size: 1em;
            color: #333;
            word-break: break-word;
        }

        .todo-meta {
            display: flex;
            gap: 10px;
            font-size: 0.75em;
            color: #999;
        }

        .todo-date {
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .todo-priority {
            background: #ff6b6b;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .todo-priority.medium {
            background: #ffa500;
        }

        .todo-priority.low {
            background: #4caf50;
        }

        .todo-actions {
            display: flex;
            gap: 8px;
        }

        .todo-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .edit-btn {
            background: #2196F3;
            color: white;
        }

        .edit-btn:hover {
            background: #1976D2;
            transform: scale(1.1);
        }

        .delete-btn {
            background: #ff6b6b;
            color: white;
        }

        .delete-btn:hover {
            background: #ff5252;
            transform: scale(1.1);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state emoji {
            font-size: 3em;
            margin-bottom: 15px;
            display: block;
        }

        .empty-state p {
            font-size: 1.1em;
        }

        .actions-bottom {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            border-top: 2px solid #e0e0e0;
            padding-top: 20px;
        }

        .clear-btn, .export-btn, .import-btn {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            color: #666;
        }

        .clear-btn:hover {
            background: #ff6b6b;
            color: white;
            border-color: #ff6b6b;
        }

        .export-btn:hover, .import-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: bold;
            color: #333;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
        }

        .modal-footer button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.2s;
        }

        .btn-cancel {
            background: #e0e0e0;
            color: #333;
        }

        .btn-cancel:hover {
            background: #ccc;
        }

        .btn-save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .success-message {
            background: #4caf50;
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #fileInput {
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
                border-radius: 10px;
            }

            .header h1 {
                font-size: 2em;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .input-section {
                flex-direction: column;
            }

            .actions-bottom {
                flex-direction: column;
            }

            .modal-content {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📋 My Tasks</h1>
            <p>Stay organized and productive</p>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-box">
                <h3 id="totalCount">0</h3>
                <p>Total Tasks</p>
            </div>
            <div class="stat-box">
                <h3 id="completedCount">0</h3>
                <p>Completed</p>
            </div>
            <div class="stat-box">
                <h3 id="pendingCount">0</h3>
                <p>Pending</p>
            </div>
        </div>

        <!-- Success Message -->
        <div id="successMessage" class="success-message" style="display: none;"></div>

        <!-- Input Section -->
        <div class="input-section">
            <input 
                type="text" 
                id="todoInput" 
                placeholder="Add a new task..." 
                autocomplete="off"
            >
            <button id="addBtn">Add Task</button>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button class="filter-btn" data-filter="high">High Priority</button>
        </div>

        <!-- Todo List -->
        <div class="todo-list" id="todoList">
            <div class="empty-state">
                <span class="empty-state emoji">✨</span>
                <p>No tasks yet. Add one to get started!</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="actions-bottom">
            <button class="export-btn" id="exportBtn">📥 Export</button>
            <button class="import-btn" id="importBtn">📤 Import</button>
            <button class="clear-btn" id="clearBtn">🗑️ Clear All</button>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">Edit Task</div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="editTaskText">Task Description</label>
                    <textarea id="editTaskText" placeholder="Enter task description..."></textarea>
                </div>
                <div class="form-group">
                    <label for="editTaskDate">Due Date</label>
                    <input type="date" id="editTaskDate">
                </div>
                <div class="form-group">
                    <label for="editTaskPriority">Priority</label>
                    <select id="editTaskPriority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="editCancel">Cancel</button>
                <button class="btn-save" id="editSave">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Hidden file input for import -->
    <input type="file" id="fileInput" accept=".json">

    <script>
        // ==========================================
        // TODO LIST APPLICATION WITH LOCAL STORAGE
        // ==========================================

        class TodoApp {
            constructor() {
                this.todos = [];
                this.currentFilter = 'all';
                this.editingId = null;
                this.init();
            }

            init() {
                this.loadFromStorage();
                this.setupEventListeners();
                this.render();
            }

            setupEventListeners() {
                // Add task
                document.getElementById('addBtn').addEventListener('click', () => this.addTodo());
                document.getElementById('todoInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTodo();
                });

                // Filter buttons
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => this.setFilter(e.target.dataset.filter));
                });

                // Action buttons
                document.getElementById('exportBtn').addEventListener('click', () => this.exportTodos());
                document.getElementById('importBtn').addEventListener('click', () => {
                    document.getElementById('fileInput').click();
                });
                document.getElementById('fileInput').addEventListener('change', (e) => this.importTodos(e));
                document.getElementById('clearBtn').addEventListener('click', () => this.clearAllTodos());

                // Edit modal
                document.getElementById('editCancel').addEventListener('click', () => this.closeEditModal());
                document.getElementById('editSave').addEventListener('click', () => this.saveEdit());
                document.getElementById('editModal').addEventListener('click', (e) => {
                    if (e.target.id === 'editModal') this.closeEditModal();
                });
            }

            addTodo() {
                const input = document.getElementById('todoInput');
                const text = input.value.trim();

                if (text === '') {
                    this.showMessage('Please enter a task!', 'error');
                    return;
                }

                const todo = {
                    id: Date.now(),
                    text: text,
                    completed: false,
                    date: new Date().toISOString().split('T')[0],
                    dueDate: '',
                    priority: 'medium',
                    createdAt: new Date().toISOString()
                };

                this.todos.push(todo);
                this.saveToStorage();
                this.render();
                input.value = '';
                input.focus();
                this.showMessage('Task added successfully!');
            }

            toggleTodo(id) {
                const todo = this.todos.find(t => t.id === id);
                if (todo) {
                    todo.completed = !todo.completed;
                    this.saveToStorage();
                    this.render();
                }
            }

            deleteTodo(id) {
                if (confirm('Are you sure you want to delete this task?')) {
                    this.todos = this.todos.filter(t => t.id !== id);
                    this.saveToStorage();
                    this.render();
                    this.showMessage('Task deleted!');
                }
            }

            openEditModal(id) {
                this.editingId = id;
                const todo = this.todos.find(t => t.id === id);
                if (todo) {
                    document.getElementById('editTaskText').value = todo.text;
                    document.getElementById('editTaskDate').value = todo.dueDate || '';
                    document.getElementById('editTaskPriority').value = todo.priority;
                    document.getElementById('editModal').classList.add('active');
                }
            }

            closeEditModal() {
                document.getElementById('editModal').classList.remove('active');
                this.editingId = null;
            }

            saveEdit() {
                if (!this.editingId) return;
                
                const todo = this.todos.find(t => t.id === this.editingId);
                if (todo) {
                    todo.text = document.getElementById('editTaskText').value.trim() || todo.text;
                    todo.dueDate = document.getElementById('editTaskDate').value;
                    todo.priority = document.getElementById('editTaskPriority').value;
                    this.saveToStorage();
                    this.render();
                    this.closeEditModal();
                    this.showMessage('Task updated!');
                }
            }

            setFilter(filter) {
                this.currentFilter = filter;
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.filter === filter);
                });
                this.render();
            }

            getFilteredTodos() {
                switch (this.currentFilter) {
                    case 'active':
                        return this.todos.filter(t => !t.completed);
                    case 'completed':
                        return this.todos.filter(t => t.completed);
                    case 'high':
                        return this.todos.filter(t => t.priority === 'high');
                    default:
                        return this.todos;
                }
            }

            updateStats() {
                const total = this.todos.length;
                const completed = this.todos.filter(t => t.completed).length;
                const pending = total - completed;

                document.getElementById('totalCount').textContent = total;
                document.getElementById('completedCount').textContent = completed;
                document.getElementById('pendingCount').textContent = pending;
            }

            render() {
                this.updateStats();
                const todoList = document.getElementById('todoList');
                const filtered = this.getFilteredTodos();

                if (filtered.length === 0) {
                    todoList.innerHTML = `
                        <div class="empty-state">
                            <span class="empty-state emoji">🎉</span>
                            <p>${this.currentFilter === 'all' ? 'No tasks yet. Add one to get started!' : 'No tasks match this filter.'}</p>
                        </div>
                    `;
                    return;
                }

                todoList.innerHTML = filtered.map(todo => `
                    <div class="todo-item ${todo.completed ? 'completed' : ''} ${todo.priority === 'high' ? 'high-priority' : ''}">
                        <input 
                            type="checkbox" 
                            class="todo-checkbox" 
                            ${todo.completed ? 'checked' : ''}
                            onchange="app.toggleTodo(${todo.id})"
                        >
                        <div class="todo-content">
                            <div class="todo-text">${this.escapeHtml(todo.text)}</div>
                            <div class="todo-meta">
                                <span class="todo-date">📅 ${todo.dueDate || 'No date'}</span>
                                <span class="todo-priority ${todo.priority}">${todo.priority.toUpperCase()}</span>
                            </div>
                        </div>
                        <div class="todo-actions">
                            <button class="todo-btn edit-btn" onclick="app.openEditModal(${todo.id})" title="Edit">✏️</button>
                            <button class="todo-btn delete-btn" onclick="app.deleteTodo(${todo.id})" title="Delete">🗑️</button>
                        </div>
                    </div>
                `).join('');
            }

            saveToStorage() {
                try {
                    localStorage.setItem('todos', JSON.stringify(this.todos));
                } catch (e) {
                    console.error('Failed to save to localStorage:', e);
                }
            }

            loadFromStorage() {
                try {
                    const stored = localStorage.getItem('todos');
                    this.todos = stored ? JSON.parse(stored) : [];
                } catch (e) {
                    console.error('Failed to load from localStorage:', e);
                    this.todos = [];
                }
            }

            exportTodos() {
                if (this.todos.length === 0) {
                    this.showMessage('No tasks to export!', 'error');
                    return;
                }

                const dataStr = JSON.stringify(this.todos, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `todos-${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                URL.revokeObjectURL(url);
                this.showMessage('Tasks exported successfully!');
            }

            importTodos(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (Array.isArray(imported)) {
                            // Merge with existing todos or replace
                            if (confirm('Replace existing tasks or merge with them?')) {
                                this.todos = imported;
                                this.showMessage('Tasks replaced!');
                            } else {
                                this.todos = [...this.todos, ...imported];
                                this.showMessage('Tasks merged!');
                            }
                            this.saveToStorage();
                            this.render();
                        } else {
                            this.showMessage('Invalid file format!', 'error');
                        }
                    } catch (error) {
                        this.showMessage('Failed to import file!', 'error');
                        console.error(error);
                    }
                };
                reader.readAsText(file);
                e.target.value = ''; // Reset file input
            }

            clearAllTodos() {
                if (this.todos.length === 0) {
                    this.showMessage('No tasks to clear!', 'error');
                    return;
                }

                if (confirm('Are you sure you want to clear all tasks? This cannot be undone!')) {
                    this.todos = [];
                    this.saveToStorage();
                    this.render();
                    this.showMessage('All tasks cleared!');
                }
            }

            showMessage(text, type = 'success') {
                const messageEl = document.getElementById('successMessage');
                messageEl.textContent = text;
                messageEl.style.background = type === 'error' ? '#ff6b6b' : '#4caf50';
                messageEl.style.display = 'block';
                setTimeout(() => {
                    messageEl.style.display = 'none';
                }, 3000);
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize app
        const app = new TodoApp();
    </script>
</body>
</html>
